<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="72" viewBox="0 0 1000 72" role="img" aria-labelledby="t d"><title id="t">Légende des couleurs</title><desc id="d">Vert : fait. Jaune : en cours. Orange : attend ta réponse. Gris : à venir.</desc><rect width="1000" height="72" rx="16" fill="#1c1c1e"/><circle cx="42" cy="36" r="6" fill="#3fb950"/><text x="56" y="41" fill="#d4d4d8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">fait</text><circle cx="146.0" cy="36" r="6" fill="none" stroke="#e3b341" stroke-width="1.8"/><circle cx="146.0" cy="36" r="2.6" fill="#e3b341"/><text x="160.0" y="41" fill="#d4d4d8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">en cours</text><circle cx="286.0" cy="36" r="6" fill="none" stroke="#f08a24" stroke-width="1.8"/><circle cx="286.0" cy="36" r="2.6" fill="#f08a24"/><text x="300.0" y="41" fill="#d4d4d8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">attend ta réponse</text><circle cx="507.0" cy="36" r="5.2" fill="none" stroke="#6e6e76" stroke-width="1.8"/><text x="521.0" y="41" fill="#d4d4d8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">à venir</text></svg>