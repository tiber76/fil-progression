<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="284" viewBox="0 0 1000 284" role="img" aria-labelledby="t d"><title id="t">Le Fil de progression dans le bandeau</title><desc id="d">Une ligne de six ronds reliés sous deux lignes de sondes, au-dessus de la zone de saisie : deux étapes faites en vert, la troisième en cours en jaune, trois à venir en gris.</desc><rect width="1000" height="284" rx="16" fill="#1c1c1e"/><rect x="28" y="28" width="944" height="132" rx="12" fill="#2a2a2d"/><circle cx="54" cy="58" r="6" fill="#3fb950"/><text x="68" y="63" fill="#8b8b93" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">Geekom · CPU 4 % · RAM 3,1 Gio · charge 12 %</text><circle cx="54" cy="88" r="6" fill="#3fb950"/><text x="68" y="93" fill="#8b8b93" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">Ce Mac · CPU 23 % · RAM 9,4 Gio · 52 °C</text><circle cx="54" cy="134" r="6" fill="#3fb950"/><text x="66" y="139" fill="#d4d4d8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">Cadrage</text><line x1="137.0" y1="134" x2="155.0" y2="134" stroke="#8b8b93" stroke-width="1.6"/><circle cx="169.0" cy="134" r="6" fill="#3fb950"/><text x="181.0" y="139" fill="#d4d4d8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">Plan</text><line x1="225.0" y1="134" x2="243.0" y2="134" stroke="#8b8b93" stroke-width="1.6"/><circle cx="257.0" cy="134" r="6" fill="none" stroke="#e3b341" stroke-width="1.8"/><circle cx="257.0" cy="134" r="2.6" fill="#e3b341"/><text x="269.0" y="139" fill="#d4d4d8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">Correctif</text><line x1="358.0" y1="134" x2="376.0" y2="134" stroke="#3a3a3e" stroke-width="1.6" stroke-dasharray="3 4"/><circle cx="390.0" cy="134" r="5.2" fill="none" stroke="#6e6e76" stroke-width="1.8"/><text x="402.0" y="139" fill="#8b8b93" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">Tests</text><line x1="455.0" y1="134" x2="473.0" y2="134" stroke="#3a3a3e" stroke-width="1.6" stroke-dasharray="3 4"/><circle cx="487.0" cy="134" r="5.2" fill="none" stroke="#6e6e76" stroke-width="1.8"/><text x="499.0" y="139" fill="#8b8b93" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">Relecture</text><line x1="588.0" y1="134" x2="606.0" y2="134" stroke="#3a3a3e" stroke-width="1.6" stroke-dasharray="3 4"/><circle cx="620.0" cy="134" r="5.2" fill="none" stroke="#6e6e76" stroke-width="1.8"/><text x="632.0" y="139" fill="#8b8b93" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">PR</text><text x="662.0" y="139" fill="#8b8b93" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">3/6</text><rect x="28" y="176" width="944" height="52" rx="12" fill="#2a2a2d" stroke="#3a3a3e"/><text x="48" y="208" fill="#6e6e76" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15">Tape / pour les commandes</text><text x="28" y="262" fill="#8b8b93" font-size="13" font-family="system-ui, sans-serif">Le Fil de progression, une ligne sous les sondes, tout contre la zone de saisie.</text></svg>